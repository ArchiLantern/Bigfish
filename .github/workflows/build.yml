name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Linux 需要的系统库（AppImage 打包）
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libx11-dev libxkbfile-dev libsecret-1-dev libgtk-3-dev

      # 安装 app 的开发依赖（electron / electron-builder）
      - name: Install app deps
        run: npm install

      # 安装后端生产依赖（dsh-bundle）
      - name: Install dsh bundle
        run: |
          cd dsh-bundle
          npm install --omit=dev

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npm run dist:mac -- --publish never

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
